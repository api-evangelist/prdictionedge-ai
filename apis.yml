- name: AUX A2A Agent (JSON-RPC)
  description: >-
    A2A 1.0 JSON-RPC interface for the AUX Evidence and Certification agent, exposing twelve bounded skills
    (business identity evidence, OFAC sanctions evidence, domain identity evidence, source attestation,
    certification profiles, durable attempts, certification, policy checks, certified handoffs, handoff
    consumption and certification requirements). Discovered through the Agent Card at
    /.well-known/agent-card.json on the API host; the endpoint answers JSON-RPC with A2A error codes.
  image: https://aux.prdictionedge.ai/og.png
