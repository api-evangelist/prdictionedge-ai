aid: prdictionedge-ai
name: AUX by PrdictionEdge
description: >-
  AUX by PrdictionEdge is a machine-native, non-executing pre-action trust layer for AI agents: before an
  agent onboards, contracts with or pays a business counterparty, AUX independently resolves live GLEIF
  legal-entity evidence, bounded exact-name OFAC screening and IANA RDAP domain identity, verifies signed
  private-source attestations, and returns ES256-signed certification receipts that any downstream system
  can verify offline against a published JWKS. The public counterparty check needs no account, API key or
  payment. The surface is published as OpenAPI 3.1, an A2A 1.0 JSON-RPC agent with a well-known Agent Card,
  an ARD manifest and llms.txt. PrdictionEdge (Chino Hills, California; founder John Bruner) has refocused
  its public work entirely on AUX.
