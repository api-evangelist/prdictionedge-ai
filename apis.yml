apis:
- name: AUX Evidence and Certification API
  description: >-
    REST API (23 operations, OpenAPI 3.1) for durable business-counterparty certification attempts, evidence
    resolution (GLEIF business identity, OFAC sanctions, RDAP domain identity, private-source attestations),
    certification profiles and requirements, signed-receipt verification, downstream policy checks, and signed
    non-executing agent-to-agent handoffs with single-use consumption. Public profiles need no API key; the
    handoff-consumption endpoint authenticates the recipient with a domain-published ES256 JWS assertion.
  image: https://aux.prdictionedge.ai/og.png
  humanURL: https://aux.prdictionedge.ai/agents
  baseURL: https://api.aux.prdictionedge.ai
